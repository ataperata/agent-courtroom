<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Replay a multi-agent trial: prosecution, defense, judge and jury argue a claim with cited evidence." />
    <title>Agent Courtroom</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b1d14'/%3E%3Cpath d='M9 22h14M16 8v14M10 12h12M10 12l-3 6h6zM22 12l-3 6h6z' stroke='%23d9b56a' stroke-width='1.6' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M9 24h14M16 7v17M9.5 11.5h13M9.5 11.5l-3.2 6.5h6.4zM22.5 11.5l-3.2 6.5h6.4z" />
        </svg>
        <span class="brand-name">Agent Courtroom</span>
      </div>
      <nav class="case-tabs" id="case-tabs" aria-label="Bundled trials"></nav>
      <label class="load-btn" title="Open a transcript JSON file">
        <input type="file" id="file-input" accept="application/json,.json" hidden />
        Open transcript
      </label>
    </header>

    <main id="app" class="app">
      <section class="empty" id="empty-state" hidden>
        <h1>No transcript loaded</h1>
        <p>Run <code>npm run demo</code> to generate the example trials, then reload. You can also drop any transcript JSON onto this page.</p>
      </section>

      <section class="docket" id="docket"></section>

      <div class="court">
        <aside class="phase-rail" id="phase-rail" aria-label="Trial phases"></aside>
        <section class="transcript" id="transcript" aria-live="polite"></section>
        <aside class="sidebar" id="sidebar">
          <div class="verdict-card" id="verdict-card"></div>
          <div class="exhibits" id="exhibits"></div>
        </aside>
      </div>
    </main>

    <div class="player" id="player">
      <button class="pbtn" id="btn-prev" title="Step back (Left arrow)" aria-label="Step back">&#9664;&#9664;</button>
      <button class="pbtn play" id="btn-play" title="Play or pause (Space)" aria-label="Play">&#9654;</button>
      <button class="pbtn" id="btn-next" title="Step forward (Right arrow)" aria-label="Step forward">&#9654;&#9654;</button>
      <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="counter" id="counter">0 / 0</span>
      <select id="speed" aria-label="Playback speed">
        <option value="1600">1x</option>
        <option value="800" selected>2x</option>
        <option value="350">4x</option>
      </select>
      <button class="pbtn text" id="btn-all" title="Show the whole record (End)">Show all</button>
    </div>

    <div class="drop-hint" id="drop-hint">Drop a transcript JSON to open it</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
